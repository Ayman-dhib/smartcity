spring.application.name=smartcity
# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI:****}

# Server Configuration (Keeping the 8081 port from main)
server.port=8081

# CRITICAL RESOLUTION: DO NOT EXCLUDE SPRING SECURITY. 
# We are commenting out or removing the line below which was causing the issue.
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging
logging.level.com.smartcity=DEBUG

# JWT Configuration
app.jwt-secret=${JWT_SECRET:****}

# Token expiration time (e.g., 86400000 ms = 24 hours)
app.jwt-expiration-milliseconds=86400000
